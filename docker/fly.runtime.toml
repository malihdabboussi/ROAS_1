app = "vibey-runtimes"
primary_region = "iad"

[env]
  NODE_ENV = "production"
  BRAIN_LLM_RERANKER = "1"
  BRAIN_LLM_RERANKER_MODEL = "google/gemini-3.5-flash"
  BRAIN_MULTI_QUERY_RETRIEVAL = "1"
  BRAIN_EVIDENCE_CHUNKS = "1"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25

  [[http_service.checks]]
    grace_period = "180s"
    interval = "30s"
    method = "get"
    timeout = "15s"
    path = "/api/health/deep"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
