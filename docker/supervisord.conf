[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:agent-api]
command=node --enable-source-maps --import /app/enable-node-compile-cache.mjs dist/apps/agent-api/src/main.js
directory=/app/agent-api
user=node
environment=HOME="/home/node",NODE_ENV="production",NODE_PATH="/app/agent-api/node_modules",NODE_COMPILE_CACHE="/app/.node-compile-cache/agent-api"
autostart=true
autorestart=true
startretries=5
startsecs=3
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openclaw-gateway]
command=node --enable-source-maps --import /app/enable-node-compile-cache.mjs /app/dist/gateway-headless.js
directory=/app
user=node
environment=HOME="/home/node",NODE_ENV="production",TERM="xterm-256color",OPENCLAW_HEADLESS="1",OPENCLAW_HEADLESS_HTTP_ONLY="1",OPENCLAW_SKIP_CANVAS_HOST="1",OPENCLAW_DISABLE_BONJOUR="1",NODE_COMPILE_CACHE="/app/.node-compile-cache/openclaw"
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser-sidecar]
command=/usr/local/bin/vibey-browser-sidecar.sh
user=root
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
