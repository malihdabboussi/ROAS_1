# Forward proxy: Instagram-related destinations only (loopback bind).
http_port 127.0.0.1:3128
cache_dir ufs /var/spool/squid 100 16 256
coredump_dir /var/spool/squid
cache deny all
via off
forwarded_for delete

acl instagram_domains dstdomain .instagram.com
acl instagram_domains dstdomain .cdninstagram.com
acl instagram_domains dstdomain .fbcdn.net
acl instagram_domains dstdomain .facebook.com

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports instagram_domains
http_access allow instagram_domains
http_access deny all
