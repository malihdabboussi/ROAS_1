name = "roas-apps-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# ROAS Cloudflare account (Dylan@dylanvanas.com)
account_id = "9d667ff9d1f587e6503e317427425e67"

# ACTIVE: public agents/widgets. DNS `*.agents` is proxied on the roas.io zone.
routes = [
  { pattern = "*.agents.roas.io/*", zone_name = "roas.io" }
]

# DORMANT — Spaces published apps ({slug}-app.roas.io). Deferred on purpose.
# DNS cannot express a `*-app` wildcard, so enabling this needs a zone-wide
# catch-all `*.roas.io` proxied record, which would swallow every unmatched
# subdomain. Turn it on only when published apps actually ship:
#   1. Uncomment the route below
#   2. Add proxied catch-all `*` DNS on roas.io
#   3. Confirm explicit records (api, app, sites, agents) still take precedence
#   4. Test one real {slug}-app.roas.io end-to-end
# routes = [
#   { pattern = "*-app.roas.io/*", zone_name = "roas.io" },
#   { pattern = "*.agents.roas.io/*", zone_name = "roas.io" }
# ]

# KV namespace "roas-apps-proxy-cache" (created 2026-07-11, ROAS Cloudflare account)
[[kv_namespaces]]
binding = "SLUG_CACHE"
id = "0beb337742d748b3b905fb5d5f4604ad"

[vars]
BACKEND_URL = "https://api.roas.io"
APPS_WEB_VERCEL_URL = "https://app.roas.io"
FLY_RUNTIME_URL = "https://roas-runtimes.fly.dev"
APPS_DOMAIN_SUFFIX = "-app.roas.io"
PUBLIC_AGENT_HOST_SUFFIX = "agents.roas.io"

# Secrets (wrangler secret put — must match roas-api / roas-web):
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# INTERNAL_API_TOKEN
# WORKER_SECRET
