name = "roas-apps-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# ROAS Cloudflare account (Dylan@dylanvanas.com)
account_id = "9d667ff9d1f587e6503e317427425e67"

# ACTIVE: public agents/widgets. DNS `*.agents` is proxied on the roas.io zone.
routes = [
  { pattern = "*.agents.roas.io/*", zone_name = "roas.io" }
]

# Published apps ({slug}-app.roas.io) remain dormant until their catch-all DNS
# and route can be enabled without swallowing explicit ROAS subdomains.

[[kv_namespaces]]
binding = "SLUG_CACHE"
id = "0beb337742d748b3b905fb5d5f4604ad"

[vars]
BACKEND_URL = "https://api.roas.io"
APPS_WEB_VERCEL_URL = "https://app.roas.io"
FLY_RUNTIME_URL = "https://roas-runtimes.fly.dev"
APPS_DOMAIN_SUFFIX = "-app.roas.io"
PUBLIC_AGENT_HOST_SUFFIX = "agents.roas.io"

# Secrets (wrangler secret put — must match roas-api / roas-web):
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# INTERNAL_API_TOKEN
# WORKER_SECRET
